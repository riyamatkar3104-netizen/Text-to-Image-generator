<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Image Generator</title>

<script src="https://cdn.jsdelivr.net/npm/particles.js"></script>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    background: linear-gradient(-45deg, #0f172a, #1e293b, #020617, #312e81);
    background-size: 400% 400%;
    animation: gradientMove 10s ease infinite;
}

@keyframes gradientMove {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

#particles-js {
    position: fixed;
    width: 100%;
    height: 100%;
    z-index: 0;
}

.wrapper {
    position: relative;
    z-index: 1;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    padding: 40px 20px;
}

.container {
    width: 100%;
    max-width: 460px;
    padding: 35px 30px;
    border-radius: 24px;
    text-align: center;
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(18px);
    box-shadow: 0 0 40px rgba(0, 245, 255, 0.15);
    animation: glow 3s infinite alternate;
}

@keyframes glow {
    from { box-shadow: 0 0 20px rgba(0,255,255,0.15); }
    to   { box-shadow: 0 0 45px rgba(124,58,237,0.5); }
}

h2 {
    margin: 0 0 8px;
    font-size: 28px;
    background: linear-gradient(90deg, #00f5ff, #7c3aed);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.subtitle {
    color: #94a3b8;
    font-size: 13px;
    margin-bottom: 24px;
}

textarea {
    width: 100%;
    padding: 13px 15px;
    margin-bottom: 14px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.1);
    outline: none;
    background: rgba(255, 255, 255, 0.08);
    color: white;
    font-size: 14px;
    font-family: 'Segoe UI', sans-serif;
    resize: vertical;
    min-height: 80px;
}

textarea::placeholder { color: #94a3b8; }

#generateBtn {
    width: 100%;
    padding: 13px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(90deg, #00f5ff, #7c3aed);
    color: white;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    letter-spacing: 0.5px;
}

#generateBtn:hover:not(:disabled) {
    transform: scale(1.03);
    box-shadow: 0 0 18px #00f5ff;
}

#generateBtn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

/* Loader */
#loader {
    display: none;
    margin: 24px 0 10px;
}

.spinner {
    width: 50px;
    height: 50px;
    border: 5px solid rgba(255,255,255,0.1);
    border-top: 5px solid #00f5ff;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
    margin: 0 auto 14px;
}

@keyframes spin { to { transform: rotate(360deg); } }

.progress-track {
    width: 100%;
    height: 8px;
    background: rgba(255,255,255,0.08);
    border-radius: 10px;
    overflow: hidden;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #00f5ff, #7c3aed);
    border-radius: 10px;
    transition: width 0.3s ease;
}

.loader-text {
    margin-top: 10px;
    color: #94a3b8;
    font-size: 13px;
}

/* Error */
#errorMsg {
    display: none;
    margin-top: 16px;
    padding: 12px;
    border-radius: 10px;
    background: rgba(239, 68, 68, 0.15);
    border: 1px solid rgba(239, 68, 68, 0.3);
    color: #fca5a5;
    font-size: 14px;
}

/* Result */
#result {
    display: none;
    margin-top: 22px;
}

#generatedImg {
    width: 100%;
    border-radius: 16px;
    box-shadow: 0 0 25px rgba(0, 245, 255, 0.2);
    animation: fadeIn 0.5s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
}

.action-buttons {
    display: flex;
    gap: 10px;
    margin-top: 14px;
}

.btn-download {
    flex: 1;
    padding: 11px;
    border-radius: 11px;
    border: none;
    background: linear-gradient(90deg, #00f5ff, #7c3aed);
    color: white;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
    transition: transform 0.2s, box-shadow 0.2s;
}

.btn-download:hover {
    transform: scale(1.03);
    box-shadow: 0 0 15px #7c3aed;
}

.btn-new {
    flex: 1;
    padding: 11px;
    border-radius: 11px;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.06);
    color: #cbd5e1;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
}

.btn-new:hover {
    background: rgba(255,255,255,0.12);
    color: white;
}
</style>
</head>

<body>

<div id="particles-js"></div>

<div class="wrapper">
    <div class="container">

        <h2>✦ AI Image Generator</h2>
        <p class="subtitle">Describe anything — get an image in seconds</p>

        <textarea id="promptInput" placeholder="e.g. A futuristic city at sunset, cyberpunk style..."></textarea>

        <button id="generateBtn" onclick="generateImage()">Generate Image</button>

        <!-- Loader -->
        <div id="loader">
            <div class="spinner"></div>
            <div class="progress-track">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <p class="loader-text" id="loaderText">Generating your image...</p>
        </div>

        <!-- Error -->
        <div id="errorMsg"></div>

        <!-- Result -->
        <div id="result">
            <img id="generatedImg" src="" alt="Generated Image">
            <div class="action-buttons">
                <a id="downloadBtn" class="btn-download" href="#" download>⬇ Download</a>
                <button class="btn-new" onclick="resetUI()">✦ New Image</button>
            </div>
        </div>

    </div>
</div>

<script>
/* Particles */
particlesJS("particles-js", {
  particles: {
    number: { value: 70 },
    color: { value: "#00f5ff" },
    shape: { type: "circle" },
    opacity: { value: 0.4 },
    size: { value: 2.5 },
    move: { enable: true, speed: 1.8 }
  }
});

let progressInterval = null;

async function generateImage() {
    const prompt = document.getElementById("promptInput").value.trim();
    if (!prompt) return;

    // Reset UI
    document.getElementById("errorMsg").style.display = "none";
    document.getElementById("result").style.display = "none";
    document.getElementById("loader").style.display = "block";
    document.getElementById("generateBtn").disabled = true;

    // Start fake progress bar
    let width = 0;
    const bar = document.getElementById("progressBar");
    const loaderText = document.getElementById("loaderText");
    bar.style.width = "0%";

    const messages = [
        "Sending prompt to AI...",
        "Generating your image...",
        "Adding details...",
        "Almost ready..."
    ];
    let msgIndex = 0;

    progressInterval = setInterval(() => {
        if (width < 88) {
            width += Math.random() * 8;
            bar.style.width = Math.min(width, 88) + "%";
        }
        if (msgIndex < messages.length - 1) {
            msgIndex++;
            loaderText.textContent = messages[msgIndex];
        }
    }, 2500);

    try {
        const formData = new FormData();
        formData.append("prompt", prompt);

        const response = await fetch("/generate", {
            method: "POST",
            body: formData
        });

        const data = await response.json();

        clearInterval(progressInterval);
        bar.style.width = "100%";

        setTimeout(() => {
            document.getElementById("loader").style.display = "none";
            document.getElementById("generateBtn").disabled = false;

            if (data.success) {
                document.getElementById("generatedImg").src = data.image_url;
                document.getElementById("downloadBtn").href = "/download/" + data.filename;
                document.getElementById("downloadBtn").download = data.filename;
                document.getElementById("result").style.display = "block";
            } else {
                showError(data.error || "Something went wrong!");
            }
        }, 400);

    } catch (err) {
        clearInterval(progressInterval);
        document.getElementById("loader").style.display = "none";
        document.getElementById("generateBtn").disabled = false;
        showError("Network error. Please try again.");
    }
}

function showError(msg) {
    const el = document.getElementById("errorMsg");
    el.textContent = "⚠ " + msg;
    el.style.display = "block";
}

function resetUI() {
    document.getElementById("result").style.display = "none";
    document.getElementById("errorMsg").style.display = "none";
    document.getElementById("promptInput").value = "";
    document.getElementById("promptInput").focus();
}

// Allow Enter + Shift for newline, Enter alone to generate
document.getElementById("promptInput").addEventListener("keydown", function(e) {
    if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        generateImage();
    }
});
</script>

</body>
</html>
